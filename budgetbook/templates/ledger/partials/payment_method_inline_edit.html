{# 行直下に挿入される支払手段インライン編集フォーム #}
<tr id="payment-method-inline-edit-{{ payment_method.pk }}" class="inline-edit-row">
  <td colspan="7">
    <form
      class="form-grid inline-edit-form"
      hx-post="{% url 'ledger:payment_method_update' payment_method.pk %}?inline=1"
      hx-target="#payment-method-inline-edit-{{ payment_method.pk }}"
      hx-swap="outerHTML"
    >
      {% csrf_token %}
      <div class="inline-edit-form__title">「{{ payment_method.name }}」を編集</div>
      {% for field in form %}
        <div class="field">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% if field.help_text %}<div class="meta">{{ field.help_text }}</div>{% endif %}
          {% if field.errors %}
            <ul class="errors">
              {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
            </ul>
          {% endif %}
        </div>
      {% endfor %}
      <div class="button-row form-grid__actions">
        <button class="btn btn--primary btn--sm" type="submit">更新する</button>
        <button
          class="btn btn--soft btn--sm"
          type="button"
          hx-get="{% url 'ledger:payment_method_update' payment_method.pk %}?inline=1&close=1"
          hx-target="#payment-method-inline-edit-{{ payment_method.pk }}"
          hx-swap="outerHTML"
        >キャンセル</button>
      </div>
    </form>
  </td>
</tr>
